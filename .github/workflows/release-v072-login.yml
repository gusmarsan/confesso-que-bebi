name: Release v0.7.2 login refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v072-login.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Apply v0.7.2 login and palette refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def patch_login(path):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              replacements = [
                  ('<meta name="theme-color" content="#ff5f7a">', '<meta name="theme-color" content="#E8644A">'),
                  ('background:#fffaf5', 'background:#F3E4D6'),
                  ('background:#fffafc', 'background:#FFFDFC'),
                  ('background:#fff;', 'background:#FFFDFC;'),
                  ('color:#776f88', 'color:#625a70'),
                  ('#ff5f7a88', '#E8644A88'),
                  ('#ff5f7a12', '#E8644A18'),
                  ('background:linear-gradient(135deg,#ff5f7a,#df3f61)', 'background:#E8644A'),
                  ('rgba(223,63,97,.22)', 'rgba(232,100,74,.22)'),
              ]
              for old, new in replacements:
                  s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")

          patch_login('acesso.html')
          patch_login('reset.html')

          launcher = Image.open('android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png').convert('RGBA')
          for size in (192, 512):
              icon = launcher.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(f'icon-{size}.png', optimize=True)

          index = Path('index.html').read_text(encoding='utf-8')
          index = index.replace('>v0.7</span>', '>v0.7.2</span>')
          index = index.replace('?v=0.7"', '?v=0.7.2"')
          index = index.replace('?v=0.7\'', '?v=0.7.2\'')
          write('index.html', index)

          sw = Path('sw.js').read_text(encoding='utf-8').replace('v0.7', 'v0.7.2')
          write('sw.js', sw)
          write('version.txt', '0.7.2\n')

          main = Path('android-app/app/src/main/java/com/gusmarsan/confessoquebebi/MainActivity.java').read_text(encoding='utf-8')
          main = main.replace('ConfessoQueBebiAndroid/0.7.1', 'ConfessoQueBebiAndroid/0.7.2')
          main = main.replace("v0.7.1", "v0.7.2")
          write('android-app/app/src/main/java/com/gusmarsan/confessoquebebi/MainActivity.java', main)

          gradle = Path('android-app/app/build.gradle.kts').read_text(encoding='utf-8')
          gradle = gradle.replace('versionCode = 8', 'versionCode = 9')
          gradle = gradle.replace('versionName = "0.7.1"', 'versionName = "0.7.2"')
          write('android-app/app/build.gradle.kts', gradle)

          build = Path('.github/workflows/build-android-apk.yml').read_text(encoding='utf-8')
          build = build.replace('v0.7.1', 'v0.7.2')
          write('.github/workflows/build-android-apk.yml', build)
          PY

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v072-login.yml
          git add acesso.html reset.html icon-192.png icon-512.png index.html sw.js version.txt android-app .github/workflows/build-android-apk.yml
          git commit -m "Release v0.7.2 login palette refresh"
          git push
