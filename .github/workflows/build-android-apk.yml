name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate launcher icon
        run: |
          test -f android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Confesso-que-bebi-v0.7.5-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Confesso-que-bebi-Android-v0.7.5
          path: Confesso-que-bebi-v0.7.5-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v0.7.5 >/dev/null 2>&1; then
            gh release upload android-v0.7.5 Confesso-que-bebi-v0.7.5-debug.apk --clobber
          else
            gh release create android-v0.7.5 Confesso-que-bebi-v0.7.5-debug.apk \
              --title "Confesso que bebi Android v0.7.5" \
              --notes "Wrapper Android corrigido para evitar cache antigo e carregar os gráficos do Histórico."
          fi
