name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android launcher icons
        run: |
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android-app/app/src/main/res/$folder"
            cp icon-192.png "android-app/app/src/main/res/$folder/ic_launcher.png"
          done
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          cp icon-512.png android-app/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Confesso-que-bebi-v0.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Confesso-que-bebi-Android-v0.4
          path: Confesso-que-bebi-v0.4-debug.apk
          if-no-files-found: error
