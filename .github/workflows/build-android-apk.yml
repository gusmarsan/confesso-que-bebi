name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "icon-512.png"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open("icon-512.png").convert("RGBA")
          res = Path("android-app/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(target / "ic_launcher.png")

          foreground = res / "drawable-nodpi"
          foreground.mkdir(parents=True, exist_ok=True)
          source.resize((432, 432), Image.Resampling.LANCZOS).save(foreground / "ic_launcher_foreground.png")
          PY

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Confesso-que-bebi-v0.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Confesso-que-bebi-Android-v0.4
          path: Confesso-que-bebi-v0.4-debug.apk
          if-no-files-found: error
