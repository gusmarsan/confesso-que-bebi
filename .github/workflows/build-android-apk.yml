name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare valid launcher icon
        run: |
          ICON_B64=''
          mkdir -p /tmp/confesso-icon
          printf '%s' "$ICON_B64" | base64 -d > /tmp/confesso-icon/ic_launcher.jpg
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android-app/app/src/main/res/$folder"
            cp /tmp/confesso-icon/ic_launcher.jpg "android-app/app/src/main/res/$folder/ic_launcher.jpg"
          done

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Confesso-que-bebi-v0.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Confesso-que-bebi-Android-v0.5
          path: Confesso-que-bebi-v0.5-debug.apk
          if-no-files-found: error
