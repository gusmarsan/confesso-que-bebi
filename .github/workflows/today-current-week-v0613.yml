name: Today link and current week v0.6.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/today-current-week-v0613.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.6.13
        run: python .github/scripts/today-current-week-v0613.py

      - name: Validate JavaScript
        run: |
          node --check app-dashboard-v06.js
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script type="module">') + len('<script type="module">')
          end = text.index('</script>', start)
          Path('/tmp/main.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/main.js

      - name: Validate v0.6.13 behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          dash = Path('app-dashboard-v06.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'id="todayLink"' in index and '>Hoje</a>' in index
          assert 'window.dispatchEvent(new CustomEvent("cqb:today"));' in index
          assert index.index('id="appVersion"') < index.index('id="syncStatus"')
          assert '>v0.6.13</span>' in index
          assert 'app-dashboard-v06.js?v=0.6.13' in index
          assert 'const hidden = key !== weekKey(current)' in dash
          assert 'const hideFromHistory = week.hidden && week.key !== currentKey;' in dash
          assert 'title.textContent = "Semana atual";' in dash
          assert 'week.entries.length === 0 && week.key !== currentKey' in dash
          assert 'selectedKey === weekKey(new Date()) || !hiddenWeeks.has(selectedKey)' in dash
          assert 'window.addEventListener("cqb:today"' in dash
          assert 'const averageGroups = visibleGroups.filter(week => addDays(week.start, 7) <= now);' in dash
          assert Path('version.txt').read_text().strip() == '0.6.13'
          assert 'confesso-que-bebi-pwa-v10' in sw
          PY

      - name: Commit v0.6.13
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-dashboard-v06.js sw.js version.txt
          git diff --cached --quiet || git commit -m 'Add Hoje link and always show current week v0.6.13'
          git push

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
