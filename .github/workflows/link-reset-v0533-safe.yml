name: Reset link hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/link-reset-v0533-safe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        run: python scripts/link_reset_v0533.py

      - name: Verify patch
        run: |
          grep -q 'href="./reset.html"' index.html
          grep -q 'Esqueci minha senha' index.html

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use real forgot-password link v0.5.3.3"
          git push
