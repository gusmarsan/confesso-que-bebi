name: Release v0.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v06.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-v06
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire v0.6 into index
        run: python scripts/wire_v06.py

      - name: Validate dashboard JavaScript
        run: node --check app-dashboard-v06.js

      - name: Validate script wiring
        run: |
          grep -q 'app-enhancements.js?v=0.6' index.html
          grep -q 'app-dashboard-v06.js?v=0.6' index.html

      - name: Commit v0.6 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Release dashboard improvements v0.6"
            git push
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
