name: Main note v0.6.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-main-hidden-week-note-v066.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.6.6
        run: python .github/scripts/remove-main-hidden-week-note-v066.py

      - name: Validate JavaScript
        run: node --check app-dashboard-v06.js

      - name: Validate main note
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app-dashboard-v06.js').read_text(encoding='utf-8')
          assert 'const noteText = mainNoteParts.join(" · ");' in text
          assert 'historyNoteParts.push(`${hiddenCount}' in text
          assert Path('version.txt').read_text().strip() == '0.6.6'
          PY

      - name: Commit v0.6.6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-dashboard-v06.js index.html version.txt
          git diff --cached --quiet || git commit -m 'Remove hidden week notice from dashboard v0.6.6'
          git push

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
