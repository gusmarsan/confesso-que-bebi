name: Past week selection v0.6.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/past-week-selection-v069.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.6.9
        run: python .github/scripts/past-week-selection-v069.py

      - name: Validate JavaScript
        run: node --check app-dashboard-v06.js

      - name: Validate past week selection
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('app-dashboard-v06.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          assert 'let selectedDayIsExplicit = false;' in js
          assert 'const showSelection = isCurrentWeek || selectedDayIsExplicit;' in js
          assert 'showSelection && key === selected' in js
          assert 'selectedDayIsExplicit = true;' in js
          assert './app-dashboard-v06.js?v=0.6.9' in index
          assert Path('version.txt').read_text().strip() == '0.6.9'
          PY

      - name: Commit v0.6.9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-dashboard-v06.js index.html sw.js version.txt
          git diff --cached --quiet || git commit -m 'Stop auto-selecting days in past weeks v0.6.9'
          git push

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
