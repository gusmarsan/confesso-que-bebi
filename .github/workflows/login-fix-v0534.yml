name: Login hotfix v0.5.3.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/login-fix-v0534.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply login fix
        run: python scripts/login_fix_v0534.py

      - name: Extract main module
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script type="module">') + len('<script type="module">')
          end = text.index('</script>', start)
          Path('/tmp/main.mjs').write_text(text[start:end], encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check /tmp/main.mjs

      - name: Validate login wiring
        run: |
          grep -q 'el.emailAccessForm.addEventListener("submit"' index.html
          grep -q 'signInWithEmailAndPassword' index.html
          grep -q 'href="./reset.html"' index.html
          ! grep -q 'sendPasswordResetEmail' index.html

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix login submit v0.5.3.4"
          git push
