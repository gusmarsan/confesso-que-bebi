name: Completed weeks average v0.6.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/completed-weeks-average-v0611.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.6.11
        run: python .github/scripts/completed-weeks-average-v0611.py

      - name: Validate JavaScript
        run: |
          node --check app-dashboard-v06.js
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script type="module">') + len('<script type="module">')
          end = text.index('</script>', start)
          Path('/tmp/main.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/main.js

      - name: Validate completed-week rule
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          dash = Path('app-dashboard-v06.js').read_text(encoding='utf-8')
          assert 'week=>!week.atypical&&week.end<now' in index
          assert 'const averageGroups = visibleGroups.filter(week => addDays(week.start, 7) <= now);' in dash
          assert 'averageGroups.reduce((sum, week) => sum + week.adjustedDoses' in dash
          assert '${averageGroups.length}' in dash
          assert '>v0.6.11</span>' in index
          assert 'app-dashboard-v06.js?v=0.6.11' in index
          assert Path('version.txt').read_text().strip() == '0.6.11'
          assert 'confesso-que-bebi-pwa-v8' in Path('sw.js').read_text(encoding='utf-8')
          PY

      - name: Commit v0.6.11
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-dashboard-v06.js sw.js version.txt
          git diff --cached --quiet || git commit -m 'Count only completed weeks in average v0.6.11'
          git push

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
