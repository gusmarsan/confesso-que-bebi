name: Direct Pages deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "acesso.html"
      - "reset.html"
      - "app-enhancements.js"
      - "app-dashboard-v06.js"
      - "history-charts-v075.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "install.html"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/pages-direct-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v0.7.5 static bundle safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = "0.7.5"
          CACHE_REV = "0.7.5-fix1"

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          html = re.sub(
              r'(<span id="appVersion"[^>]*>)v[^<]+(</span>)',
              rf'\1v{VERSION}\2',
              html,
              count=1,
          )
          html = re.sub(
              r'app-enhancements\.js\?v=[^"\']+',
              f'app-enhancements.js?v={VERSION}',
              html,
          )
          html = re.sub(
              r'app-dashboard-v06\.js\?v=[^"\']+',
              f'app-dashboard-v06.js?v={VERSION}',
              html,
          )

          history_script = f'<script type="module" src="./history-charts-v075.js?v={VERSION}"></script>'
          if "history-charts-v075.js" not in html:
              closing_body = html.rfind("</body>")
              if closing_body == -1:
                  raise RuntimeError("Fechamento </body> não encontrado em index.html")
              html = html[:closing_body] + f'  {history_script}\n' + html[closing_body:]

          if html.count("history-charts-v075.js") != 1:
              raise RuntimeError("O script dos gráficos foi inserido em local inesperado")

          index_path.write_text(html, encoding="utf-8")

          enhancements_path = Path("app-enhancements.js")
          enhancements = enhancements_path.read_text(encoding="utf-8")
          enhancements = enhancements.replace('"v0.7.3"', f'"v{VERSION}"')
          enhancements_path.write_text(enhancements, encoding="utf-8")

          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = re.sub(r'confesso-que-bebi-pwa-v[^"\']+', f'confesso-que-bebi-pwa-v{CACHE_REV}', sw)
          sw = re.sub(r'app-enhancements\.js\?v=[^"\']+', f'app-enhancements.js?v={VERSION}', sw)
          sw = re.sub(r'app-dashboard-v06\.js\?v=[^"\']+', f'app-dashboard-v06.js?v={VERSION}', sw)
          sw_path.write_text(sw, encoding="utf-8")
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
