name: Direct Pages deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "acesso.html"
      - "reset.html"
      - "app-enhancements.js"
      - "app-dashboard-v06.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "install.html"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/pages-direct-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.7.5 history day charts
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard_path = Path('app-dashboard-v06.js')
          dashboard = dashboard_path.read_text(encoding='utf-8')

          anchor = '  function installWeekNavigationGuard() {'
          charts = r'''  function installHistoryDayChartStyles() {
    if ($("#cqb-history-day-charts-style")) return;
    const style = document.createElement("style");
    style.id = "cqb-history-day-charts-style";
    style.textContent = `
      .cqb-history-day-charts{margin:22px 0 4px}
      .cqb-history-day-charts-head{margin:0 2px 11px}
      .cqb-history-day-charts-head h2{margin:0;font-size:1rem;letter-spacing:-.025em}
      .cqb-history-day-charts-head p{margin:5px 0 0;color:var(--muted);font-size:.72rem;font-weight:500;line-height:1.4}
      .cqb-history-day-chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
      .cqb-history-day-chart-card{min-width:0;padding:14px;border:1px solid var(--line);border-radius:19px;background:var(--card);box-shadow:0 8px 25px rgba(79,49,93,.05)}
      .cqb-history-day-chart-card header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
      .cqb-history-day-chart-card h3{margin:0;font-size:.82rem;letter-spacing:-.02em}
      .cqb-history-day-chart-card header span{color:var(--muted);font-size:.65rem;font-weight:750;white-space:nowrap}
      .cqb-history-chart-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:3px;scrollbar-width:thin;scrollbar-color:#c9bbcf transparent}
      .cqb-history-chart-scroll::-webkit-scrollbar{height:5px}
      .cqb-history-chart-scroll::-webkit-scrollbar-thumb{border-radius:999px;background:#c9bbcf}
      .cqb-history-chart-svg{display:block;height:154px;min-width:100%}
      .cqb-history-chart-empty{min-height:154px;display:grid;place-items:center;padding:14px;color:var(--muted);font-size:.69rem;font-weight:600;line-height:1.45;text-align:center}
      .cqb-history-chart-summary{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:7px}
      .cqb-history-chart-summary strong{font-size:.84rem;color:var(--ink)}
      .cqb-history-chart-summary small{color:var(--muted);font-size:.64rem;font-weight:600}
      @media(max-width:760px){.cqb-history-day-chart-grid{grid-template-columns:1fr}.cqb-history-day-chart-card{padding:13px}.cqb-history-chart-svg{height:150px}}
    `;
    document.head.appendChild(style);
  }

  function historySeriesForDay(dayOfWeek) {
    const totals = new Map();
    entries.forEach(item => {
      const key = String(item.datetime || "").slice(0, 10);
      if (!key) return;
      const date = parseDateKey(key);
      if (date.getDay() !== dayOfWeek) return;
      totals.set(key, (totals.get(key) || 0) + Number(item.doses || 0));
    });
    return [...totals.entries()]
      .map(([key, doses]) => ({ key, doses }))
      .sort((a, b) => a.key.localeCompare(b.key));
  }

  function historyLineChartSvg(points, color) {
    const width = Math.max(292, 52 + points.length * 58);
    const height = 154;
    const left = 32;
    const right = 12;
    const top = 14;
    const bottom = 28;
    const plotWidth = width - left - right;
    const plotHeight = height - top - bottom;
    const maxDose = Math.max(1, ...points.map(point => Number(point.doses || 0)));
    const yMax = Math.max(1, Math.ceil(maxDose * 1.14));
    const xAt = index => points.length === 1 ? left + plotWidth / 2 : left + (index / (points.length - 1)) * plotWidth;
    const yAt = value => top + plotHeight - (Number(value || 0) / yMax) * plotHeight;
    const path = points.map((point, index) => `${index ? "L" : "M"}${xAt(index).toFixed(1)},${yAt(point.doses).toFixed(1)}`).join(" ");
    const grid = [0, .5, 1].map(fraction => {
      const y = top + plotHeight * fraction;
      const label = formatNumber(yMax * (1 - fraction), 1);
      return `<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="#eee5ed" stroke-width="1"/><text x="${left-6}" y="${y+3}" text-anchor="end" fill="#625a70" font-size="9" font-weight="650">${label}</text>`;
    }).join("");
    const dots = points.map((point, index) => {
      const x = xAt(index);
      const y = yAt(point.doses);
      return `<g><circle cx="${x}" cy="${y}" r="4.2" fill="${color}" stroke="#FFFDFC" stroke-width="2"><title>${formatShortDateKey(point.key)} · ${formatNumber(point.doses, 2)} doses</title></circle><text x="${x}" y="${height-8}" text-anchor="middle" fill="#625a70" font-size="9" font-weight="650">${formatShortDateKey(point.key)}</text></g>`;
    }).join("");
    return `<svg class="cqb-history-chart-svg" viewBox="0 0 ${width} ${height}" width="${width}" role="img" aria-label="Evolução de doses registradas"><path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${grid}${dots}</svg>`;
  }

  function updateHistoryDayCharts() {
    installHistoryDayChartStyles();
    const historyHero = $(".history-hero");
    if (!historyHero) return;

    let section = $("#cqbHistoryDayCharts");
    if (!section) {
      section = document.createElement("section");
      section.id = "cqbHistoryDayCharts";
      section.className = "cqb-history-day-charts";
      historyHero.insertAdjacentElement("afterend", section);
    }

    const definitions = [
      { day: 5, title: "Sextas-feiras", color: "#E8644A" },
      { day: 6, title: "Sábados", color: "#344C73" },
      { day: 0, title: "Domingos", color: "#4BA9B8" }
    ];

    const cards = definitions.map(definition => {
      const points = historySeriesForDay(definition.day);
      if (!points.length) {
        return `<article class="cqb-history-day-chart-card"><header><h3>${definition.title}</h3><span>0 dias</span></header><div class="cqb-history-chart-empty">Nenhum dia registrado ainda.</div></article>`;
      }
      const latest = points.at(-1);
      const countLabel = `${points.length} ${points.length === 1 ? "dia" : "dias"}`;
      return `<article class="cqb-history-day-chart-card"><header><h3>${definition.title}</h3><span>${countLabel}</span></header><div class="cqb-history-chart-scroll">${historyLineChartSvg(points, definition.color)}</div><div class="cqb-history-chart-summary"><strong>${formatNumber(latest.doses, 2)} doses</strong><small>último · ${formatShortDateKey(latest.key)}</small></div></article>`;
    }).join("");

    section.innerHTML = `<div class="cqb-history-day-charts-head"><h2>Por dia da semana</h2><p>Evolução das doses registradas em sextas, sábados e domingos</p></div><div class="cqb-history-day-chart-grid">${cards}</div>`;
  }

'''

          if 'function updateHistoryDayCharts()' not in dashboard:
              if anchor not in dashboard:
                  raise SystemExit('navigation anchor not found')
              dashboard = dashboard.replace(anchor, charts + anchor, 1)

          old_refresh = '    updateHistoryCards();\n  }'
          new_refresh = '    updateHistoryCards();\n    updateHistoryDayCharts();\n  }'
          if old_refresh in dashboard:
              dashboard = dashboard.replace(old_refresh, new_refresh, 1)
          elif 'updateHistoryDayCharts();' not in dashboard:
              raise SystemExit('refresh anchor not found')

          dashboard = dashboard.replace('v0.7.4', 'v0.7.5')
          dashboard_path.write_text(dashboard, encoding='utf-8')

          enhancements_path = Path('app-enhancements.js')
          enhancements = enhancements_path.read_text(encoding='utf-8').replace('v0.7.4', 'v0.7.5')
          enhancements_path.write_text(enhancements, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          for old in ('v0.7.2', 'v0.7.3', 'v0.7.4'):
              index = index.replace(old, 'v0.7.5')
          index = index.replace('app-enhancements.js?v=0.7.4', 'app-enhancements.js?v=0.7.5')
          index = index.replace('app-dashboard-v06.js?v=0.7.4', 'app-dashboard-v06.js?v=0.7.5')
          index_path.write_text(index, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          for old in ('v0.7.2', 'v0.7.3', 'v0.7.4'):
              sw = sw.replace(old, 'v0.7.5')
          sw = sw.replace('app-enhancements.js?v=0.7"', 'app-enhancements.js?v=0.7.5"')
          sw = sw.replace('app-dashboard-v06.js?v=0.7"', 'app-dashboard-v06.js?v=0.7.5"')
          sw_path.write_text(sw, encoding='utf-8')

          Path('version.txt').write_text('0.7.5\n', encoding='utf-8')
          PY

      - name: Commit v0.7.5 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-dashboard-v06.js app-enhancements.js index.html sw.js version.txt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Release v0.7.5 history weekday charts"
            git push
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
