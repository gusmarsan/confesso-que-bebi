name: Direct Pages deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "acesso.html"
      - "reset.html"
      - "app-enhancements.js"
      - "app-dashboard-v06.js"
      - "history-charts-v075.js"
      - "backup-xlsx-v076.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "install.html"
      - "version.txt"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/pages-direct-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare authoritative v0.7.6 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION = "0.7.6"
          CACHE_REV = "0.7.6-fix1"
          SW_MARKER = "cqb-sw-bootstrap-076-fix1"

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          html = re.sub(
              r'(<span id="appVersion"[^>]*>)v[^<]+(</span>)',
              rf'\1v{VERSION}\2',
              html,
              count=1,
          )
          html = re.sub(r'app-enhancements\.js\?v=[^"\']+', f'app-enhancements.js?v={VERSION}', html)
          html = re.sub(r'app-dashboard-v06\.js\?v=[^"\']+', f'app-dashboard-v06.js?v={VERSION}', html)
          html = re.sub(r'history-charts-v075\.js\?v=[^"\']+', f'history-charts-v075.js?v={VERSION}', html)
          html = re.sub(r'backup-xlsx-v076\.js\?v=[^"\']+', f'backup-xlsx-v076.js?v={VERSION}', html)

          chart_script = f'<script type="module" src="./history-charts-v075.js?v={VERSION}"></script>'
          if chart_script not in html:
              closing_body = html.rfind("</body>")
              if closing_body == -1:
                  raise RuntimeError("Fechamento </body> não encontrado em index.html")
              html = html[:closing_body] + f'  {chart_script}\n' + html[closing_body:]

          backup_script = f'<script type="module" src="./backup-xlsx-v076.js?v={VERSION}"></script>'
          if backup_script not in html:
              closing_body = html.rfind("</body>")
              if closing_body == -1:
                  raise RuntimeError("Fechamento </body> não encontrado em index.html")
              html = html[:closing_body] + f'  {backup_script}\n' + html[closing_body:]

          html = re.sub(
              r'\n\s*<script id="cqb-sw-bootstrap-[^"]+">.*?</script>',
              '',
              html,
              flags=re.S,
          )
          marker = '<body class="auth-pending">'
          updater = f'''\n  <script id="{SW_MARKER}">\n  (() => {{\n    if (!("serviceWorker" in navigator)) return;\n    const reloadKey = "{SW_MARKER}-reloaded";\n    navigator.serviceWorker.addEventListener("controllerchange", () => {{\n      if (sessionStorage.getItem(reloadKey)) return;\n      sessionStorage.setItem(reloadKey, "1");\n      location.reload();\n    }});\n    navigator.serviceWorker.register("./sw.js?rev={CACHE_REV}", {{scope:"./", updateViaCache:"none"}})\n      .then(registration => registration.update())\n      .catch(error => console.error("Falha ao atualizar service worker", error));\n  }})();\n  </script>'''
          if marker not in html:
              raise RuntimeError("Marcador do body não encontrado em index.html")
          html = html.replace(marker, marker + updater, 1)
          index_path.write_text(html, encoding="utf-8")

          for filename in ["app-enhancements.js", "app-dashboard-v06.js", "history-charts-v075.js"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'v0\.7\.[0-9]+', f'v{VERSION}', text)
              path.write_text(text, encoding="utf-8")

          install_path = Path("install.html")
          install = install_path.read_text(encoding="utf-8")
          install = re.sub(
              r'navigator\.serviceWorker\.register\("/confesso-que-bebi/sw\.js(?:\?rev=[^"]+)?", \{scope:"/confesso-que-bebi/"(?:,updateViaCache:"none")?\}\)',
              f'navigator.serviceWorker.register("/confesso-que-bebi/sw.js?rev={CACHE_REV}", {{scope:"/confesso-que-bebi/",updateViaCache:"none"}})',
              install,
          )
          install_path.write_text(install, encoding="utf-8")

          sw = f'''const CACHE_NAME = "confesso-que-bebi-pwa-v{CACHE_REV}";\nconst APP_SHELL = [\n  "./",\n  "./index.html",\n  "./acesso.html",\n  "./reset.html",\n  "./install.html",\n  "./manifest.webmanifest",\n  "./app-enhancements.js?v={VERSION}",\n  "./app-dashboard-v06.js?v={VERSION}",\n  "./history-charts-v075.js?v={VERSION}",\n  "./backup-xlsx-v076.js?v={VERSION}",\n  "./icon-192.png",\n  "./icon-512.png"\n];\n\nself.addEventListener("install", event => {{\n  event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)).catch(() => undefined));\n  self.skipWaiting();\n}});\n\nself.addEventListener("activate", event => {{\n  event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key)))));\n  self.clients.claim();\n}});\n\nself.addEventListener("fetch", event => {{\n  const request = event.request;\n  if (request.method !== "GET") return;\n  const url = new URL(request.url);\n  if (url.origin !== self.location.origin) return;\n  event.respondWith(\n    fetch(request, {{cache:"no-store"}})\n      .then(response => {{\n        if (response && response.ok) {{\n          const copy = response.clone();\n          caches.open(CACHE_NAME).then(cache => cache.put(request, copy)).catch(() => undefined);\n        }}\n        return response;\n      }})\n      .catch(() => caches.match(request).then(cached => cached || caches.match("./index.html")))\n  );\n}});\n'''
          Path("sw.js").write_text(sw, encoding="utf-8")
          Path("version.txt").write_text(f"{VERSION}\n", encoding="utf-8")
          PY

      - name: Verify v0.7.6 source bundle
        run: |
          grep -q '>v0.7.6</span>' index.html
          grep -q 'app-enhancements.js?v=0.7.6' index.html
          grep -q 'app-dashboard-v06.js?v=0.7.6' index.html
          grep -q 'history-charts-v075.js?v=0.7.6' index.html
          grep -q 'backup-xlsx-v076.js?v=0.7.6' index.html
          grep -q 'cqb-sw-bootstrap-076-fix1' index.html
          grep -q 'const yMax = 30' history-charts-v075.js
          grep -q 'BACKUP_TYPE = "confesso-que-bebi-backup"' backup-xlsx-v076.js
          grep -q 'drinkEntries' backup-xlsx-v076.js
          grep -q 'atypicalWeeks' backup-xlsx-v076.js
          grep -q 'confesso-que-bebi-pwa-v0.7.6-fix1' sw.js
          grep -q '^0.7.6$' version.txt

      - name: Sync prepared source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-enhancements.js app-dashboard-v06.js history-charts-v075.js backup-xlsx-v076.js sw.js install.html version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Make v0.7.6 source authoritative"
            git push origin HEAD:main
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
