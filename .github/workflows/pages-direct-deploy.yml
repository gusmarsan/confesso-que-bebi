name: Direct Pages deploy

# Force v0.7.5 web redeploy after confirming the public bundle was stale.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "acesso.html"
      - "reset.html"
      - "app-enhancements.js"
      - "app-dashboard-v06.js"
      - "history-charts-v075.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "install.html"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/pages-direct-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v0.7.5 static bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = re.sub(
              r'(<span id="appVersion"[^>]*>)v[^<]+(</span>)',
              r'\1v0.7.5\2',
              html,
              count=1,
          )

          script = '<script type="module" src="./history-charts-v075.js?v=0.7.5"></script>'
          if 'history-charts-v075.js' not in html:
              html = html.replace('</body>', f'  {script}\n</body>')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
