name: Direct Pages deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "acesso.html"
      - "reset.html"
      - "app-enhancements.js"
      - "app-dashboard-v06.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "install.html"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/pages-direct-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.7.3 threshold toast
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          toast_anchor = '''    function toast(message){
      clearTimeout(toastTimer);
      el.toast.textContent=message;
      el.toast.classList.add("show");
      toastTimer=setTimeout(()=>el.toast.classList.remove("show"),2400);
    }
'''
          helper = '''    function toast(message){
      clearTimeout(toastTimer);
      el.toast.textContent=message;
      el.toast.classList.add("show");
      toastTimer=setTimeout(()=>el.toast.classList.remove("show"),2400);
    }

    function expectedConsumptionThresholdToast(item,previousItem=null){
      const key=String(item?.datetime||"").slice(0,10);
      if(!key)return "";

      const date=parseLocalDate(item.datetime);
      const weekDayIndex=(date.getDay()+6)%7;
      const expected=DAY_LIMITS[weekDayIndex];
      if(!expected)return "";

      const currentTotal=entries
        .filter(entry=>String(entry.datetime||"").slice(0,10)===key)
        .reduce((sum,entry)=>sum+Number(entry.doses||0),0);
      const previousKey=String(previousItem?.datetime||"").slice(0,10);
      const previousDose=previousItem&&previousKey===key?Number(previousItem.doses||0):0;
      const beforeTotal=currentTotal-Number(item.doses||0)+previousDose;
      const threshold=expected*.7;

      if(beforeTotal<threshold&&currentTotal>=threshold){
        const weekday=new Intl.DateTimeFormat("pt-BR",{weekday:"long"}).format(date);
        return `Você chegou a 70% do consumo esperado para ${weekday}.`;
      }
      return "";
    }
'''

          if 'function expectedConsumptionThresholdToast' not in index:
              if toast_anchor not in index:
                  raise SystemExit('Toast anchor not found')
              index = index.replace(toast_anchor, helper, 1)

          old_submit = '      toast(wasEditing?"Registro atualizado.":"Bebida registrada.");'
          new_submit = '''      const thresholdToast=expectedConsumptionThresholdToast(item,previousItem);
      toast(thresholdToast||(wasEditing?"Registro atualizado.":"Bebida registrada."));'''
          if old_submit in index:
              index = index.replace(old_submit, new_submit, 1)
          elif 'const thresholdToast=expectedConsumptionThresholdToast' not in index:
              raise SystemExit('Submit toast anchor not found')

          index = index.replace('v0.7.2', 'v0.7.3')
          index_path.write_text(index, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8').replace('v0.7.2', 'v0.7.3')
          sw_path.write_text(sw, encoding='utf-8')
          Path('version.txt').write_text('0.7.3\n', encoding='utf-8')

          main_path = Path('android-app/app/src/main/java/com/gusmarsan/confessoquebebi/MainActivity.java')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace('ConfessoQueBebiAndroid/0.7.2', 'ConfessoQueBebiAndroid/0.7.3')
          main = main.replace('v0.7.2', 'v0.7.3')
          main_path.write_text(main, encoding='utf-8')

          gradle_path = Path('android-app/app/build.gradle.kts')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = gradle.replace('versionCode = 9', 'versionCode = 10')
          gradle = gradle.replace('versionName = "0.7.2"', 'versionName = "0.7.3"')
          gradle_path.write_text(gradle, encoding='utf-8')
          PY

      - name: Commit v0.7.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js version.txt android-app
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release v0.7.3 70 percent threshold toast"
            git push
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
