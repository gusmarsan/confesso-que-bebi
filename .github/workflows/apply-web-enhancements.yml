name: Restore stable web app

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-web-enhancements.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore stable index
        run: |
          git checkout 9a2b654a0cff947ea89fc232096d162475bbace1 -- index.html

      - name: Commit rollback
        run: |
          if git diff --quiet; then
            echo "Stable index already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rollback broken web auth change"
          git push
