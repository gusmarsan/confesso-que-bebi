name: Atypical future-only v0.6.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atypical-future-only-v0614.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.6.14
        run: python .github/scripts/atypical-future-only-v0614.py

      - name: Validate JavaScript
        run: |
          node --check app-dashboard-v06.js
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script type="module">') + len('<script type="module">')
          end = text.index('</script>', start)
          Path('/tmp/main.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/main.js

      - name: Validate v0.6.14 behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          dash = Path('app-dashboard-v06.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'return groups.filter(week=>week.end<now);' in index
          assert '!week.atypical&&week.end<now' not in index
          assert 'const adjustedDoses = actualDoses;' in dash
          assert 'averageGroups.reduce((sum, week) => sum + week.actualDoses, 0)' in dash
          avg_block = dash[dash.index('function updateAveragesAndCounts'):dash.index('async function hideEmptyWeek')]
          assert 'dia atípico desconsiderado' not in avg_block
          assert 'function installAtypicalControlPosition()' in dash
          assert 'actions.appendChild(today)' in dash
          assert 'actions.appendChild(control)' in dash
          assert dash.index('actions.appendChild(today)') < dash.index('actions.appendChild(control)')
          assert '.cqb-day-actions .atypical-control' in dash
          assert '>v0.6.14</span>' in index
          assert index.index('id="appVersion"') < index.index('id="syncStatus"')
          assert 'app-dashboard-v06.js?v=0.6.14' in index
          assert Path('version.txt').read_text().strip() == '0.6.14'
          assert 'confesso-que-bebi-pwa-v11' in sw
          PY

      - name: Commit v0.6.14
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-dashboard-v06.js sw.js version.txt
          git diff --cached --quiet || git commit -m 'Keep atypical days out of averages logic v0.6.14'
          git push

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
