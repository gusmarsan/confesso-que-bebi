name: Hidden week navigation v0.6.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hidden-week-navigation-v067.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.6.7
        run: python scripts/patch-v067.py

      - name: Validate JavaScript
        run: node --check app-dashboard-v06.js

      - name: Validate hidden week navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app-dashboard-v06.js').read_text(encoding='utf-8')
          assert 'function ensureSelectedWeekVisible()' in text
          assert 'hiddenWeeks.has(selectedKey)' in text
          assert 'installWeekNavigationGuard();' in text
          assert 'hiddenWeeks.add(key);' in text
          assert 'app-dashboard-v06.js?v=0.6.7' in Path('index.html').read_text(encoding='utf-8')
          assert Path('version.txt').read_text().strip() == '0.6.7'
          PY

      - name: Commit v0.6.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-dashboard-v06.js index.html version.txt
          git diff --cached --quiet || git commit -m 'Skip excluded weeks on dashboard v0.6.7'
          git push

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4