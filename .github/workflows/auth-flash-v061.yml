name: Auth flash fix v0.6.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-flash-v061.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply auth flash fix
        run: python scripts/auth_flash_v061.py

      - name: Validate auth pending state
        run: |
          grep -q 'body class="auth-pending"' index.html
          grep -q 'requestAnimationFrame(()=>document.body.classList.remove("auth-pending"))' index.html
          grep -q 'body.auth-pending .auth-screen' index.html

      - name: Commit v0.6.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Hide login flash while restoring session v0.6.1"
            git push
          fi
