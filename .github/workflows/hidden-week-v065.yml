name: Hidden week v0.6.5

on:
  push:
    branches: [main]
    paths:
      - "tools/patch_hidden_week_v065.py"
      - ".github/workflows/hidden-week-v065.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hidden-week-v065
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.6.5
        run: python tools/patch_hidden_week_v065.py

      - name: Validate JavaScript
        run: node --check app-dashboard-v06.js

      - name: Validate hidden week behavior
        run: |
          grep -q 'cqb-hidden-week' app-dashboard-v06.js
          grep -q 'setProperty("display", "none", "important")' app-dashboard-v06.js
          grep -q 'app-dashboard-v06.js?v=0.6.5' index.html
          grep -q '^0.6.5$' version.txt

      - name: Commit v0.6.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-dashboard-v06.js index.html version.txt
          git diff --cached --quiet || git commit -m "Hide excluded weeks reliably v0.6.5"
          git push

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
