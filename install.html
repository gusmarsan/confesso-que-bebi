<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff5f7a">
  <title>Instalar · Confesso que bebi</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffaf5;color:#2d2540;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);text-align:center}
    img{width:132px;height:132px;border-radius:30px;box-shadow:0 18px 42px rgba(45,37,64,.18)}
    h1{margin:22px 0 8px;font-size:1.6rem;letter-spacing:-.04em}
    p{margin:0 auto 20px;max-width:340px;color:#776f88;font-size:.9rem;line-height:1.5}
    button,a{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;border-radius:15px;font:inherit;font-weight:850;text-decoration:none}
    button{border:0;background:#2d2540;color:#fff;cursor:pointer}
    button:disabled{opacity:.55;cursor:default}
    a{margin-top:10px;border:1px solid #eee5ed;background:#fff;color:#2d2540}
    small{display:block;margin-top:16px;color:#776f88;font-size:.72rem;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <img src="./icon-512.png" alt="Ícone do Confesso que bebi">
    <h1>Confesso que bebi</h1>
    <p>Instale no celular para abrir em tela própria, direto pelo ícone.</p>
    <button id="installButton" disabled>Preparando instalação…</button>
    <a href="./">Abrir o app</a>
    <small id="help">Se o botão não aparecer, abra o menu do navegador e escolha “Adicionar à tela inicial” ou “Instalar app”.</small>
  </main>
  <script>
    let deferredPrompt = null;
    const button = document.getElementById("installButton");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", {scope:"./"}).catch(console.error);
    }

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredPrompt = event;
      button.disabled = false;
      button.textContent = "Instalar no celular";
    });

    button.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      button.disabled = true;
      button.textContent = "Instalação concluída ou dispensada";
    });

    window.addEventListener("appinstalled", () => {
      button.disabled = true;
      button.textContent = "App instalado";
      document.getElementById("help").textContent = "Pronto. Abra o Confesso que bebi pelo novo ícone na tela do celular.";
    });

    setTimeout(() => {
      if (!deferredPrompt) {
        button.disabled = true;
        button.textContent = "Use o menu do navegador para instalar";
      }
    }, 3500);
  </script>
</body>
</html>
