<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff5f7a">
  <title>Acesso · Confesso que bebi</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffaf5;color:#2d2540;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:24px;border:1px solid #eee5ed;border-radius:26px;background:#fff;box-shadow:0 18px 45px rgba(79,49,93,.12)}
    .brand{text-align:center}
    img{width:86px;height:86px;border-radius:22px;box-shadow:0 14px 32px rgba(45,37,64,.16)}
    h1{margin:16px 0 7px;font-size:1.42rem;letter-spacing:-.04em}
    p{margin:0 0 20px;color:#776f88;font-size:.8rem;line-height:1.5}
    label{display:block;margin:0 0 7px;color:#776f88;font-size:.69rem;font-weight:800}
    input{width:100%;height:50px;margin:0 0 13px;padding:0 14px;border:1px solid #eee5ed;border-radius:14px;background:#fffafc;color:#2d2540;font:inherit;outline:none}
    input:focus{border-color:#ff5f7a88;box-shadow:0 0 0 4px #ff5f7a12}
    button{width:100%;min-height:50px;border:0;border-radius:14px;font:inherit;font-weight:900;cursor:pointer}
    button:disabled{opacity:.58;cursor:wait}
    .primary{background:linear-gradient(135deg,#ff5f7a,#df3f61);color:#fff;box-shadow:0 10px 24px rgba(223,63,97,.22)}
    .secondary{margin-top:10px;background:#fff;color:#2d2540;box-shadow:inset 0 0 0 1px #ded7df}
    small{display:block;min-height:36px;margin-top:14px;color:#776f88;font-size:.69rem;line-height:1.45;text-align:center}
    .error{color:#b23f57}
    .success{color:#168d78}
    .hint{margin-top:16px;padding-top:14px;border-top:1px solid #eee5ed;color:#776f88;font-size:.65rem;line-height:1.45;text-align:center}
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="./icon-512.png" alt="Ícone do Confesso que bebi">
      <h1>Confesso que bebi</h1>
      <p>Entre uma vez. Depois, a sessão fica salva neste aparelho.</p>
    </div>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required>

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>

      <button id="loginButton" class="primary" type="submit">Entrar</button>
      <button id="resetButton" class="secondary" type="button">Definir ou redefinir senha</button>
    </form>

    <small id="status" aria-live="polite">Se você ainda não tem senha, toque em “Definir ou redefinir senha”.</small>
    <div class="hint">A redefinição usa um e-mail separado do antigo link de login. Depois que a senha estiver criada, volte aqui e entre normalmente.</div>
  </main>

  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      initializeAuth,indexedDBLocalPersistence,browserLocalPersistence,onAuthStateChanged,
      signInWithEmailAndPassword,sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig={
      apiKey:"AIzaSyCntynX17PUan8o1EAW0-QFOOCNeQnMY5g",
      authDomain:"confesso-que-bebi.firebaseapp.com",
      projectId:"confesso-que-bebi",
      storageBucket:"confesso-que-bebi.firebasestorage.app",
      messagingSenderId:"324283589525",
      appId:"1:324283589525:web:78a0bcc2f7b736a6f78c9c"
    };

    const firebaseApp=initializeApp(firebaseConfig);
    const auth=initializeAuth(firebaseApp,{
      persistence:[indexedDBLocalPersistence,browserLocalPersistence]
    });
    auth.languageCode="pt-BR";

    const form=document.getElementById("loginForm");
    const email=document.getElementById("email");
    const password=document.getElementById("password");
    const loginButton=document.getElementById("loginButton");
    const resetButton=document.getElementById("resetButton");
    const status=document.getElementById("status");

    email.value=localStorage.getItem("confesso-que-bebi-email-link-address")||"";

    function setBusy(busy){
      loginButton.disabled=busy;
      resetButton.disabled=busy;
      email.disabled=busy;
      password.disabled=busy;
    }

    function show(message,type=""){
      status.className=type;
      status.textContent=message;
    }

    function messageFor(error){
      const code=String(error?.code||"");
      const messages={
        "auth/invalid-credential":"E-mail ou senha incorretos. Se ainda não criou uma senha, use “Definir ou redefinir senha”.",
        "auth/wrong-password":"Senha incorreta. Você pode redefini-la abaixo.",
        "auth/user-not-found":"Não encontrei uma conta com este e-mail.",
        "auth/invalid-email":"Confira o endereço de e-mail.",
        "auth/too-many-requests":"Muitas tentativas seguidas. Tente novamente depois.",
        "auth/network-request-failed":"Não foi possível acessar a internet.",
        "auth/operation-not-allowed":"O acesso por e-mail e senha não está habilitado no Firebase."
      };
      return messages[code]||`Não foi possível concluir o acesso. Código: ${code||"erro-sem-codigo"}`;
    }

    form.addEventListener("submit",async event=>{
      event.preventDefault();
      const address=email.value.trim().toLowerCase();
      const secret=password.value;
      if(!address||secret.length<6){
        show("Digite o e-mail e uma senha com pelo menos 6 caracteres.","error");
        return;
      }
      setBusy(true);
      show("Entrando…");
      try{
        localStorage.setItem("confesso-que-bebi-email-link-address",address);
        await signInWithEmailAndPassword(auth,address,secret);
        show("Acesso concluído. Abrindo o app…","success");
        location.replace("./index.html");
      }catch(error){
        console.error(error);
        show(messageFor(error),"error");
        setBusy(false);
      }
    });

    resetButton.addEventListener("click",async()=>{
      const address=email.value.trim().toLowerCase();
      if(!address){
        show("Digite primeiro o e-mail da sua conta.","error");
        email.focus();
        return;
      }
      setBusy(true);
      show("Enviando o e-mail para criar ou redefinir a senha…");
      try{
        localStorage.setItem("confesso-que-bebi-email-link-address",address);
        await sendPasswordResetEmail(auth,address,{
          url:"https://gusmarsan.github.io/confesso-que-bebi/acesso.html"
        });
        show("E-mail enviado. Abra a mensagem, crie a senha e depois volte a este app para entrar.","success");
      }catch(error){
        console.error(error);
        show(messageFor(error),"error");
      }finally{
        setBusy(false);
      }
    });

    onAuthStateChanged(auth,user=>{
      if(user)location.replace("./index.html");
    });
  </script>
</body>
</html>
